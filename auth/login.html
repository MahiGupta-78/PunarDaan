<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | PUNARDAAN</title>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <!-- Core Styles -->
  <link rel="stylesheet" href="../css/global-styles.css"/>
  
  <style>
    body { background: var(--bg-main); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .auth-container { width: 100%; max-width: 450px; background: var(--bg-card); border-radius: 32px; padding: 40px; border: 1px solid var(--border-color); box-shadow: var(--shadow-lg); }
    .password-wrapper { position: relative; }
    .toggle-password { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-muted); }
  </style>
</head>
<body class="light-mode">

  <div class="auth-container glass animate-fade-in">
    <div style="text-align: center; margin-bottom: 30px;">
      <img src="../punardan.png" style="width: 60px; margin-bottom: 15px;">
      <h1 style="font-size: 2rem; font-weight: 800;">Welcome Back</h1>
      <p style="color: var(--text-muted);">Access your PUNARDAAN dashboard.</p>
    </div>

    <form id="loginForm">
      <div class="form-group mb-4">
        <label>Email Address</label>
        <input type="email" id="email" required placeholder="email@example.com" class="form-control" style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border-color);">
      </div>

      <div class="form-group mb-4">
        <label>Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" required placeholder="••••••••" class="form-control" style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border-color);">
          <i class="fas fa-eye toggle-password" onclick="togglePass('password')"></i>
        </div>
      </div>

      <div class="flex-between mb-4">
        <label style="display: flex; align-items: center; gap: 8px; font-size: 0.9rem; cursor: pointer;">
          <input type="checkbox"> Remember me
        </label>
        <a href="#" style="font-size: 0.9rem; color: var(--primary); font-weight: 600;">Forgot Password?</a>
      </div>

      <button type="submit" id="loginSubmit" class="btn btn-primary" style="width: 100%;">Sign In</button>
    </form>

    <p style="text-align: center; margin-top: 30px; color: var(--text-muted);">
      Don't have an account? <a href="register.html" style="color: var(--primary); font-weight: 700;">Join Now</a>
    </p>
  </div>

  <script src="../js/core.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Core.init();
      if (Core.state.isAuthenticated) Core.auth.redirect();
    });

    function togglePass(id) {
      const el = document.getElementById(id);
      el.type = el.type === 'password' ? 'text' : 'password';
    }

    document.getElementById('loginForm').onsubmit = (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      
      const finish = Core.showLoading(document.getElementById('loginSubmit'), 'Signing in...');
      
      setTimeout(() => {
        const res = Core.auth.login(email, pass);
        finish();
        if (res.success) {
          Core.showToast('Login successful!', 'success');
          setTimeout(() => Core.auth.redirect(), 1000);
        } else {
          Core.showToast(res.error, 'error');
        }
      }, 1000);
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Join PUNARDAAN | Registration</title>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <!-- Core Styles -->
  <link rel="stylesheet" href="../css/global-styles.css"/>
  
  <style>
    body { background: var(--bg-main); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .auth-container { width: 100%; max-width: 600px; background: var(--bg-card); border-radius: 32px; padding: 40px; border: 1px solid var(--border-color); box-shadow: var(--shadow-lg); }
    .role-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-bottom: 30px; }
    .role-card { padding: 20px; border-radius: 20px; border: 1px solid var(--border-color); text-align: center; cursor: pointer; transition: var(--transition); background: var(--bg-main); }
    .role-card:hover, .role-card.active { border-color: var(--primary); background: rgba(16, 185, 129, 0.05); transform: translateY(-5px); }
    .role-card.active { box-shadow: 0 0 0 2px var(--primary); }
    .role-card i { font-size: 1.5rem; color: var(--primary); margin-bottom: 10px; display: block; }
    .form-step { display: none; }
    .form-step.active { display: block; animation: slideIn 0.4s ease-out; }
    .password-wrapper { position: relative; }
    .toggle-password { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-muted); }
    .strength-meter { height: 4px; background: #e2e8f0; border-radius: 2px; margin-top: 8px; overflow: hidden; }
    .strength-bar { height: 100%; width: 0; transition: var(--transition); }
  </style>
</head>
<body class="light-mode">

  <div class="auth-container glass">
    <div style="text-align: center; margin-bottom: 30px;">
      <img src="../punardan.png" style="width: 60px; margin-bottom: 15px;">
      <h1 style="font-size: 2rem; font-weight: 800;">Create Account</h1>
      <p style="color: var(--text-muted);">Join the smartest humanitarian ecosystem.</p>
    </div>

    <!-- STEP 1: ROLE SELECTION -->
    <div id="step1" class="form-step active">
      <h3 style="margin-bottom: 20px;">Choose Your Role</h3>
      <div class="role-grid">
        <div class="role-card" onclick="selectRole('donor')" data-role="donor">
          <i class="fas fa-hand-holding-heart"></i>
          <span>Donor</span>
        </div>
        <div class="role-card" onclick="selectRole('volunteer')" data-role="volunteer">
          <i class="fas fa-hands-helping"></i>
          <span>Volunteer</span>
        </div>
        <div class="role-card" onclick="selectRole('ngo')" data-role="ngo">
          <i class="fas fa-building"></i>
          <span>NGO</span>
        </div>
        <div class="role-card" onclick="selectRole('student')" data-role="student">
          <i class="fas fa-user-graduate"></i>
          <span>Student</span>
        </div>
      </div>
      <button class="btn btn-primary" style="width: 100%;" onclick="goToStep2()" id="continueBtn" disabled>Continue</button>
      <p style="text-align: center; margin-top: 20px;">Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 700;">Login</a></p>
    </div>

    <!-- STEP 2: REGISTRATION FORM -->
    <div id="step2" class="form-step">
      <button class="btn btn-outline btn-xs mb-4" onclick="goToStep1()"><i class="fas fa-arrow-left"></i> Back</button>
      <h3 id="roleTitle" style="margin-bottom: 20px;">Register as Donor</h3>
      
      <form id="registerForm">
        <div class="grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
          <div class="form-group mb-3">
            <label>Full Name</label>
            <input type="text" id="name" required placeholder="Enter full name" class="form-control" style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border-color);">
          </div>
          <div class="form-group mb-3">
            <label>Email Address</label>
            <input type="email" id="email" required placeholder="email@example.com" class="form-control" style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border-color);">
          </div>
        </div>

        <div class="grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
          <div class="form-group mb-3">
            <label>Phone Number</label>
            <input type="tel" id="phone" required placeholder="10-digit number" class="form-control" style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border-color);">
          </div>
          <div class="form-group mb-3">
            <label>City</label>
            <input type="text" id="city" required placeholder="Dehradun" class="form-control" style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border-color);">
          </div>
        </div>

        <!-- DYNAMIC FIELDS -->
        <div id="dynamicFields"></div>

        <div class="form-group mb-3">
          <label>Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" required placeholder="Min 6 characters" class="form-control" style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border-color);">
            <i class="fas fa-eye toggle-password" onclick="togglePass('password')"></i>
          </div>
          <div class="strength-meter"><div id="strengthBar" class="strength-bar"></div></div>
        </div>

        <button type="submit" class="btn btn-primary mt-4" style="width: 100%;">Create Account</button>
      </form>
    </div>
  </div>

  <script src="../js/core.js"></script>
  <script>
    let selectedRole = '';
    
    document.addEventListener('DOMContentLoaded', () => {
      Core.init();
      // Auto-select role if in URL
      const urlParams = new URLSearchParams(window.location.search);
      const role = urlParams.get('role');
      if (role) selectRole(role);
    });

    function selectRole(role) {
      selectedRole = role;
      document.querySelectorAll('.role-card').forEach(c => c.classList.remove('active'));
      document.querySelector(`[data-role="${role}"]`).classList.add('active');
      document.getElementById('continueBtn').disabled = false;
    }

    function goToStep2() {
      document.getElementById('step1').classList.remove('active');
      document.getElementById('step2').classList.add('active');
      document.getElementById('roleTitle').textContent = `Register as ${selectedRole.toUpperCase()}`;
      renderDynamicFields();
    }

    function goToStep1() {
      document.getElementById('step2').classList.remove('active');
      document.getElementById('step1').classList.add('active');
    }

    function renderDynamicFields() {
      const container = document.getElementById('dynamicFields');
      container.innerHTML = '';
      
      if (selectedRole === 'ngo') {
        container.innerHTML = `
          <div class="form-group mb-3">
            <label>NGO Registration ID</label>
            <input type="text" id="ngoId" required placeholder="Reg-123456" class="form-control" style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border-color);">
          </div>
        `;
      } else if (selectedRole === 'volunteer') {
        container.innerHTML = `
          <div class="form-group mb-3">
            <label>Your Skills</label>
            <input type="text" id="skills" required placeholder="e.g. Driving, Teaching, Medical" class="form-control" style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border-color);">
          </div>
        `;
      } else if (selectedRole === 'donor') {
        container.innerHTML = `
          <div class="form-group mb-3">
            <label>Blood Group (Optional)</label>
            <select id="bloodGroup" class="form-control" style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border-color);">
              <option value="">Select Group</option>
              <option>O+</option><option>O-</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option>
            </select>
          </div>
        `;
      }
    }

    function togglePass(id) {
      const el = document.getElementById(id);
      el.type = el.type === 'password' ? 'text' : 'password';
    }

    document.getElementById('password').oninput = (e) => {
      const strength = e.target.value.length * 10;
      const bar = document.getElementById('strengthBar');
      bar.style.width = Math.min(strength, 100) + '%';
      bar.style.background = strength < 40 ? '#ef4444' : strength < 70 ? '#f59e0b' : '#10b981';
    };

    document.getElementById('registerForm').onsubmit = (e) => {
      e.preventDefault();
      const userData = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        city: document.getElementById('city').value,
        password: document.getElementById('password').value,
        role: selectedRole
      };
      
      const res = Core.auth.register(userData);
      if (res.success) {
        Core.showToast('Account created successfully!', 'success');
        setTimeout(() => window.location.href = 'login.html', 1500);
      } else {
        Core.showToast(res.error, 'error');
      }
    };
  </script>
</body>
</html>
